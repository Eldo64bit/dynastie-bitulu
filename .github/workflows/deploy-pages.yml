name: Deploy Dynastie BITULU to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GITHUB_ACTIONS: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preserve cached bundle compatibility
        run: |
          current_js=$(ls dist/public/assets/index-*.js | head -n 1)
          for alias in index-C2SjQMho.js index-CwkDu93x.js; do
            target="dist/public/assets/$alias"
            if [ "$current_js" != "$target" ]; then cp "$current_js" "$target"; fi
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
