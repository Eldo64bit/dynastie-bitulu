name: Deploy Dynastie BITULU to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_ACTIONS: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preserve cached bundle compatibility
        run: |
          current_js=$(find dist/public/assets -maxdepth 1 -name 'index-*.js' ! -name 'index-C2SjQMho.js' ! -name 'index-CwkDu93x.js' -print -quit)
          cp "$current_js" dist/public/assets/index-C2SjQMho.js
          cp "$current_js" dist/public/assets/index-CwkDu93x.js
      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: dist/public
          branch: gh-pages
          clean: true
